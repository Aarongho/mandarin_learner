<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mandarin">
<meta name="theme-color" content="#6A040F">
<title>Kata Harian Mandarin</title>
<style>
  :root{
    --merah:#B3001B; --merah-tua:#6A040F; --emas:#FFD166; --krem:#FFF8EE;
    --teks:#2B1B17; --abu:#8a7f7b; --hijau:#2E9E5B; --salah:#D64545;
    --kartu:#ffffff; --radius:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--krem); color:var(--teks);
    font-family:-apple-system,"SF Pro",Segoe UI,Roboto,sans-serif; height:100%;}
  body{display:flex; flex-direction:column; min-height:100dvh;}

  header{background:linear-gradient(135deg,var(--merah),var(--merah-tua));
    color:#fff; padding:calc(env(safe-area-inset-top) + 14px) 18px 14px;
    display:flex; align-items:center; justify-content:space-between;}
  header h1{font-size:17px; margin:0; font-weight:700; letter-spacing:.3px;}
  header .streak{background:rgba(255,255,255,.15); border-radius:999px;
    padding:5px 12px; font-size:13px; font-weight:600;}

  main{flex:1; overflow-y:auto; padding:16px 16px 90px;}

  nav{position:fixed; bottom:0; left:0; right:0; background:#fff;
    border-top:1px solid #eee2d5; display:flex;
    padding-bottom:env(safe-area-inset-bottom);}
  nav button{flex:1; border:none; background:none; padding:10px 0 8px;
    font-size:11px; color:var(--abu); display:flex; flex-direction:column;
    align-items:center; gap:3px; font-weight:600;}
  nav button .ic{font-size:21px; line-height:1;}
  nav button.aktif{color:var(--merah);}

  .kartu{background:var(--kartu); border-radius:var(--radius);
    box-shadow:0 2px 10px rgba(107,4,15,.07); padding:20px; margin-bottom:14px;}
  .label{font-size:12px; font-weight:700; letter-spacing:1px; color:var(--abu);
    text-transform:uppercase; margin-bottom:8px;}

  .hanzi-besar{font-size:64px; font-weight:700; text-align:center; margin:6px 0;
    font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;}
  .pinyin{color:var(--merah); font-size:22px; text-align:center; font-weight:600;}
  .arti{font-size:17px; text-align:center; margin-top:6px; color:#4a3a35;}
  .contoh{margin-top:14px; background:var(--krem); border-radius:12px;
    padding:12px; font-size:14px; text-align:center; color:#5a4a44;}
  .lencana{display:inline-block; background:var(--emas); color:#5a3b00;
    border-radius:999px; font-size:12px; font-weight:700; padding:4px 10px;}

  .tombol{display:block; width:100%; border:none; border-radius:14px;
    padding:15px; font-size:16px; font-weight:700; margin-top:10px;}
  .tombol.utama{background:var(--merah); color:#fff;}
  .tombol.kedua{background:#fff; color:var(--merah); border:2px solid var(--merah);}
  .tombol:disabled{opacity:.4;}
  .tombol-audio{border:none; background:var(--krem); color:var(--merah);
    border-radius:999px; padding:8px 16px; font-size:14px; font-weight:700;
    display:block; margin:10px auto 0;}

  /* flashcard flip */
  .flip-wrap{perspective:1000px; height:300px; margin-bottom:12px;}
  .flip{position:relative; width:100%; height:100%;
    transform-style:preserve-3d; transition:transform .45s;}
  .flip.terbalik{transform:rotateY(180deg);}
  .muka{position:absolute; inset:0; backface-visibility:hidden;
    -webkit-backface-visibility:hidden; background:#fff; border-radius:var(--radius);
    box-shadow:0 2px 10px rgba(107,4,15,.08); display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:18px;}
  .muka.belakang{transform:rotateY(180deg);}
  .petunjuk{color:var(--abu); font-size:13px; margin-top:12px;}

  .progress-bar{height:8px; background:#f0e4d6; border-radius:99px; overflow:hidden;}
  .progress-bar>div{height:100%; background:var(--merah); border-radius:99px;
    transition:width .3s;}
  .baris-progres{display:flex; align-items:center; gap:10px; margin:8px 0;}
  .baris-progres .nm{width:52px; font-size:13px; font-weight:700;}
  .baris-progres .angka{width:86px; text-align:right; font-size:12px; color:var(--abu);}
  .baris-progres .progress-bar{flex:1;}

  /* kuis */
  .opsi{display:block; width:100%; text-align:left; border:2px solid #eee2d5;
    background:#fff; border-radius:14px; padding:14px; font-size:16px;
    margin-top:10px; font-weight:600; color:var(--teks);}
  .opsi.benar{border-color:var(--hijau); background:#e9f7ef;}
  .opsi.salah{border-color:var(--salah); background:#fdecec;}
  .soal-hanzi{font-size:46px; text-align:center; font-weight:700; margin:4px 0;
    font-family:"PingFang SC","Noto Sans SC",sans-serif;}
  .soal-teks{font-size:22px; text-align:center; font-weight:700; margin:12px 0;}

  .statistik{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .stat{background:#fff; border-radius:var(--radius); padding:16px; text-align:center;
    box-shadow:0 2px 10px rgba(107,4,15,.07);}
  .stat .nilai{font-size:28px; font-weight:800; color:var(--merah);}
  .stat .ket{font-size:12px; color:var(--abu); font-weight:600; margin-top:2px;}

  .riwayat{font-size:14px; color:#5a4a44; padding:6px 0; border-bottom:1px solid #f2e8db;
    display:flex; justify-content:space-between;}
  .pusat{text-align:center; color:var(--abu); padding:30px 10px; font-size:15px;}
  .skor-besar{font-size:52px; font-weight:800; text-align:center; color:var(--merah);}
</style>
</head>
<body>
<header>
  <h1>一天一词 · Kata Harian</h1>
  <div class="streak" id="streak">🔥 0</div>
</header>
<main id="main"><div class="pusat">Memuat kosakata…</div></main>
<nav>
  <button id="nav-hari" onclick="pindah('hari')"><span class="ic">📅</span>Hari Ini</button>
  <button id="nav-belajar" onclick="pindah('belajar')"><span class="ic">🎴</span>Belajar</button>
  <button id="nav-review" onclick="pindah('review')"><span class="ic">🔁</span>Review</button>
  <button id="nav-progres" onclick="pindah('progres')"><span class="ic">📊</span>Progres</button>
</nav>

<script>
"use strict";
let DATA = null, WORDS = [];
const UKURAN_BATCH = 10;

/* ---------- penyimpanan (aman di semua konteks) ---------- */
const bawaan = { pointer:0, review:[], benarTotal:0, salahTotal:0,
  riwayatKuis:[], streak:0, terakhirBelajar:null };
let S = { ...bawaan };
function muatState(){
  try{ const t = localStorage.getItem("mandarin_v1");
    if(t) S = { ...bawaan, ...JSON.parse(t) }; }catch(e){}
}
function simpan(){ try{ localStorage.setItem("mandarin_v1", JSON.stringify(S)); }catch(e){} }

function catatStreak(){
  const hariIni = new Date().toDateString();
  if(S.terakhirBelajar === hariIni) return;
  const kemarin = new Date(Date.now()-86400000).toDateString();
  S.streak = (S.terakhirBelajar === kemarin) ? S.streak + 1 : 1;
  S.terakhirBelajar = hariIni; simpan(); gambarStreak();
}
function gambarStreak(){ document.getElementById("streak").textContent = "🔥 " + (S.streak||0); }

/* ---------- audio pelafalan ---------- */
function ucap(teks){
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(teks);
    u.lang = "zh-CN"; u.rate = 0.85;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- util ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function acak(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function kataHariIni(){
  const mulai = new Date(DATA.start_date + "T00:00:00");
  const kini = new Date(); const hr = new Date(kini.getFullYear(),kini.getMonth(),kini.getDate());
  const idx = Math.max(0, Math.round((hr - mulai)/86400000));
  return { w: WORDS[idx % WORDS.length], hari: idx + 1 };
}

/* ---------- navigasi ---------- */
let tabAktif = "hari";
function pindah(tab){
  tabAktif = tab;
  ["hari","belajar","review","progres"].forEach(t=>
    document.getElementById("nav-"+t).classList.toggle("aktif", t===tab));
  ({hari:tHari, belajar:tBelajar, review:tReview, progres:tProgres})[tab]();
}
const M = () => document.getElementById("main");

/* ---------- TAB: Hari Ini ---------- */
function tHari(){
  const {w, hari} = kataHariIni();
  M().innerHTML = `
    <div class="kartu">
      <div style="text-align:center"><span class="lencana">📅 Hari ke-${hari} · HSK ${w.hsk}</span></div>
      <div class="hanzi-besar">${esc(w.hanzi)}</div>
      <div class="pinyin">${esc(w.pinyin)}</div>
      <div class="arti">${esc(w.arti)}</div>
      ${w.contoh ? `<div class="contoh">${esc(w.contoh)}<br><i>${esc(w.contoh_pinyin)}</i><br>${esc(w.contoh_arti)}</div>` : ""}
      <button class="tombol-audio" onclick="ucap('${esc(w.hanzi)}')">🔊 Dengar pelafalan</button>
    </div>
    <button class="tombol utama" onclick="pindah('belajar')">Mulai belajar hari ini →</button>`;
}

/* ---------- TAB: Belajar (flashcard batch 10 → kuis) ---------- */
let sesi = null;
function tBelajar(){
  if(sesi && ["kartu","kuis","hasil"].includes(sesi.mode)) return gambarSesi();
  sesi = null;
  const sisa = WORDS.length - S.pointer;
  M().innerHTML = `
    <div class="kartu">
      <div class="label">Sesi belajar</div>
      <p style="margin:4px 0 12px; font-size:15px;">Pelajari <b>${Math.min(UKURAN_BATCH,sisa)} kata baru</b> lewat flashcard,
      lalu kerjakan <b>kuis pilihan ganda</b> untuk mengunci ingatan. Kata yang salah otomatis masuk Review.</p>
      <div class="progress-bar"><div style="width:${(S.pointer/WORDS.length*100).toFixed(1)}%"></div></div>
      <div style="font-size:12px; color:var(--abu); margin-top:6px;">${S.pointer} / ${WORDS.length} kata sudah dipelajari</div>
    </div>
    ${sisa>0
      ? `<button class="tombol utama" onclick="mulaiSesi()">🎴 Mulai ${Math.min(UKURAN_BATCH,sisa)} kata berikutnya</button>`
      : `<div class="pusat">🎉 Semua ${WORDS.length} kata sudah dipelajari!</div>`}`;
}
function mulaiSesi(){
  const batch = WORDS.slice(S.pointer, S.pointer + UKURAN_BATCH);
  if(!batch.length) return;
  sesi = { mode:"kartu", batch, i:0, terbalik:false, soal:null, noSoal:0, benar:0, salahKata:[] };
  gambarSesi();
}
function gambarSesi(){
  if(sesi.mode === "kartu") return gambarKartu();
  if(sesi.mode === "kuis") return gambarSoal();
  if(sesi.mode === "hasil") return gambarHasil();
}
function gambarKartu(){
  const w = sesi.batch[sesi.i];
  M().innerHTML = `
    <div class="label" style="text-align:center">Kartu ${sesi.i+1} / ${sesi.batch.length} · HSK ${w.hsk}</div>
    <div class="flip-wrap" onclick="balikKartu()">
      <div class="flip ${sesi.terbalik?'terbalik':''}" id="flip">
        <div class="muka">
          <div class="hanzi-besar">${esc(w.hanzi)}</div>
          <div class="petunjuk">ketuk untuk lihat arti</div>
        </div>
        <div class="muka belakang">
          <div class="pinyin">${esc(w.pinyin)}</div>
          <div class="arti" style="font-size:20px">${esc(w.arti)}</div>
          ${w.contoh ? `<div class="contoh">${esc(w.contoh)}<br>${esc(w.contoh_arti)}</div>` : ""}
        </div>
      </div>
    </div>
    <button class="tombol-audio" onclick="event.stopPropagation(); ucap('${esc(w.hanzi)}')">🔊 Dengar</button>
    <button class="tombol utama" onclick="kartuLanjut()">${sesi.i+1 < sesi.batch.length ? "Lanjut →" : "Mulai kuis ✍️"}</button>`;
}
function balikKartu(){ sesi.terbalik = !sesi.terbalik; document.getElementById("flip").classList.toggle("terbalik", sesi.terbalik); }
function kartuLanjut(){
  if(sesi.i + 1 < sesi.batch.length){ sesi.i++; sesi.terbalik = false; gambarKartu(); }
  else { sesi.mode = "kuis"; sesi.urutan = acak(sesi.batch); sesi.noSoal = 0; buatSoal(); gambarSoal(); }
}

/* ---------- kuis pilihan ganda ---------- */
function buatSoal(kumpulan){
  const w = (kumpulan || sesi.urutan)[sesi.noSoal];
  const keArti = Math.random() < 0.5;
  const distraktor = [];
  const sumber = WORDS.filter(x => x.id !== w.id && Math.abs(x.hsk - w.hsk) <= 1);
  while(distraktor.length < 3 && sumber.length){
    const k = sumber[Math.floor(Math.random()*sumber.length)];
    if(!distraktor.includes(k)) distraktor.push(k);
  }
  const opsi = acak([w, ...distraktor]);
  sesi.soal = { w, keArti, opsi, terjawab:false };
}
function gambarSoal(){
  const q = sesi.soal, total = (sesi.urutan || sesi.batch).length;
  M().innerHTML = `
    <div class="label" style="text-align:center">Kuis · Soal ${sesi.noSoal+1} / ${total}</div>
    <div class="kartu">
      ${q.keArti
        ? `<div class="soal-hanzi">${esc(q.w.hanzi)}</div><div class="pinyin" style="font-size:16px">${esc(q.w.pinyin)}</div>
           <p style="text-align:center; color:var(--abu); font-size:14px; margin:8px 0 0;">Apa artinya?</p>`
        : `<div class="soal-teks">"${esc(q.w.arti)}"</div>
           <p style="text-align:center; color:var(--abu); font-size:14px; margin:8px 0 0;">Yang mana hanzinya?</p>`}
      <div id="opsi-wrap">
        ${q.opsi.map((o,i)=>`<button class="opsi" id="op${i}" onclick="jawab(${i})">
          ${q.keArti ? esc(o.arti) : `<span style="font-size:22px">${esc(o.hanzi)}</span> <span style="color:var(--abu);font-size:13px">${esc(o.pinyin)}</span>`}
        </button>`).join("")}
      </div>
      <button class="tombol utama" id="btn-next" style="display:none" onclick="soalLanjut()">Lanjut →</button>
    </div>`;
}
function jawab(i){
  const q = sesi.soal;
  if(q.terjawab) return;
  q.terjawab = true;
  const benar = q.opsi[i].id === q.w.id;
  q.opsi.forEach((o,j)=>{
    const el = document.getElementById("op"+j);
    if(o.id === q.w.id) el.classList.add("benar");
    else if(j === i) el.classList.add("salah");
    el.disabled = true;
  });
  if(benar){ sesi.benar++; S.benarTotal++; }
  else { sesi.salahKata.push(q.w.id); S.salahTotal++; }
  ucap(q.w.hanzi);
  simpan();
  document.getElementById("btn-next").style.display = "block";
}
function soalLanjut(){
  const total = sesi.urutan.length;
  if(sesi.noSoal + 1 < total){ sesi.noSoal++; buatSoal(); gambarSoal(); }
  else {
    // sesi belajar selesai
    S.pointer += sesi.batch.length;
    sesi.salahKata.forEach(id => { if(!S.review.includes(id)) S.review.push(id); });
    S.riwayatKuis.unshift({ t: new Date().toISOString().slice(0,10), skor: sesi.benar, dari: total });
    S.riwayatKuis = S.riwayatKuis.slice(0, 20);
    catatStreak(); simpan();
    sesi.mode = "hasil"; gambarHasil();
  }
}
function gambarHasil(){
  const total = sesi.urutan.length, persen = Math.round(sesi.benar/total*100);
  M().innerHTML = `
    <div class="kartu" style="text-align:center">
      <div class="label">Hasil kuis</div>
      <div class="skor-besar">${sesi.benar}/${total}</div>
      <p style="margin:6px 0 0; font-weight:700;">${persen>=80?"加油! Hebat! 🎉":persen>=50?"Lumayan, terus latihan! 💪":"Jangan menyerah, coba review ya 🔁"}</p>
      ${sesi.salahKata.length ? `<p style="font-size:14px; color:var(--abu);">${sesi.salahKata.length} kata yang salah masuk ke tab Review.</p>` : ""}
    </div>
    <button class="tombol utama" onclick="sesi=null; tBelajar()">Belajar 10 kata lagi</button>
    ${sesi.salahKata.length ? `<button class="tombol kedua" onclick="sesi=null; pindah('review')">Review kata yang salah</button>` : ""}`;
}

/* ---------- TAB: Review ---------- */
function tReview(){
  if(sesi && sesi.mode === "kuisReview") return gambarSoalReview();
  if(!S.review.length){
    M().innerHTML = `<div class="pusat">✨ Tidak ada kata untuk di-review.<br>Kata yang salah di kuis akan muncul di sini.</div>`;
    return;
  }
  M().innerHTML = `
    <div class="kartu">
      <div class="label">Review</div>
      <p style="margin:4px 0; font-size:15px;"><b>${S.review.length} kata</b> menunggu di-review. Jawab benar untuk mengeluarkannya dari daftar.</p>
    </div>
    <button class="tombol utama" onclick="mulaiReview()">🔁 Mulai review</button>`;
}
function mulaiReview(){
  const kumpulan = acak(S.review.map(id => WORDS[id-1])).slice(0, UKURAN_BATCH);
  sesi = { mode:"kuisReview", urutan:kumpulan, noSoal:0, benar:0, salahKata:[], soal:null };
  buatSoal(kumpulan); gambarSoalReview();
}
function gambarSoalReview(){
  gambarSoal();
  document.getElementById("btn-next").onclick = soalReviewLanjut;
}
function soalReviewLanjut(){
  const q = sesi.soal;
  // jawaban benar -> kata keluar dari daftar review
  if(!sesi.salahKata.includes(q.w.id)){
    S.review = S.review.filter(id => id !== q.w.id);
  }
  simpan();
  if(sesi.noSoal + 1 < sesi.urutan.length){
    sesi.noSoal++; buatSoal(sesi.urutan); gambarSoalReview();
  } else {
    const b = sesi.benar, t = sesi.urutan.length;
    sesi = null; catatStreak(); simpan();
    M().innerHTML = `
      <div class="kartu" style="text-align:center">
        <div class="label">Review selesai</div>
        <div class="skor-besar">${b}/${t}</div>
        <p style="font-size:14px; color:var(--abu);">Sisa kata di review: ${S.review.length}</p>
      </div>
      ${S.review.length ? `<button class="tombol utama" onclick="mulaiReview()">Lanjut review</button>` : ""}
      <button class="tombol kedua" onclick="pindah('belajar')">Kembali belajar</button>`;
  }
}

/* ---------- TAB: Progres ---------- */
function tProgres(){
  const perLevel = {};
  WORDS.forEach(w => { perLevel[w.hsk] = perLevel[w.hsk] || {total:0, selesai:0};
    perLevel[w.hsk].total++; if(w.id <= S.pointer) perLevel[w.hsk].selesai++; });
  const akurasi = (S.benarTotal + S.salahTotal) ? Math.round(S.benarTotal/(S.benarTotal+S.salahTotal)*100) : 0;
  M().innerHTML = `
    <div class="statistik">
      <div class="stat"><div class="nilai">${S.pointer}</div><div class="ket">Kata dipelajari</div></div>
      <div class="stat"><div class="nilai">${akurasi}%</div><div class="ket">Akurasi kuis</div></div>
      <div class="stat"><div class="nilai">${S.streak||0}</div><div class="ket">Streak hari 🔥</div></div>
      <div class="stat"><div class="nilai">${S.review.length}</div><div class="ket">Perlu review</div></div>
    </div>
    <div class="kartu" style="margin-top:14px">
      <div class="label">Progres per level HSK</div>
      ${Object.keys(perLevel).sort().map(lv=>{
        const p = perLevel[lv], pct = (p.selesai/p.total*100).toFixed(1);
        return `<div class="baris-progres"><div class="nm">HSK ${lv}</div>
          <div class="progress-bar"><div style="width:${pct}%"></div></div>
          <div class="angka">${p.selesai}/${p.total}</div></div>`;
      }).join("")}
    </div>
    <div class="kartu">
      <div class="label">Riwayat kuis terakhir</div>
      ${S.riwayatKuis.length
        ? S.riwayatKuis.slice(0,10).map(r=>`<div class="riwayat"><span>${r.t}</span><b>${r.skor}/${r.dari}</b></div>`).join("")
        : `<div style="color:var(--abu); font-size:14px;">Belum ada kuis.</div>`}
    </div>`;
}

/* ---------- init ---------- */
muatState(); gambarStreak();
fetch("daily_words.json")
  .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => { DATA = d; WORDS = d.words; pindah("hari"); })
  .catch(() => {
    M().innerHTML = `<div class="pusat">⚠️ Gagal memuat <b>daily_words.json</b>.<br>
      Pastikan file itu berada di folder yang sama dengan halaman ini.</div>`;
  });
</script>
</body>
</html>
